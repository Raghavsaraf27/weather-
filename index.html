<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aesthetic Weather Widget</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #191919;
      --card-bg: #202020;
      --border-color: #333333;
      --text-main: #f5f5f5;
      --text-muted: #888888;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      overflow: hidden;
    }

    .widget-container {
      width: 100%;
      max-width: 300px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Top Section: Location & Description */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .location {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-main);
      letter-spacing: 0.5px;
    }

    .condition {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: capitalize;
      background: #2a2a2a;
      padding: 4px 10px;
      border-radius: 12px;
    }

    /* Middle Section: Big Icon & Temp */
    .main-weather {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
    }

    .icon-large {
      font-size: 4.5rem;
      line-height: 1;
      filter: drop-shadow(0 4px 12px rgba(255, 255, 255, 0.15));
      /* Cute floating animation */
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .temp-large {
      font-size: 3.5rem;
      font-weight: 300;
      color: var(--text-main);
      letter-spacing: -2px;
    }

    /* Bottom Section: Forecast */
    .forecast-container {
      display: flex;
      justify-content: space-between;
      border-top: 1px solid var(--border-color);
      padding-top: 16px;
    }

    .forecast-day {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .f-day-name {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .f-icon {
      font-size: 1.2rem;
    }

    .f-temp {
      font-size: 0.8rem;
      color: var(--text-main);
      font-weight: 500;
    }

    #loading {
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div id="loading">Loading aesthetic weather...</div>

  <div class="widget-container" id="widget" style="display: none;">
    
    <div class="header">
      <div class="location" id="city">--</div>
      <div class="condition" id="desc">--</div>
    </div>

    <div class="main-weather">
      <div class="icon-large" id="main-icon">☀️</div>
      <div class="temp-large" id="temp">--°</div>
    </div>

    <div class="forecast-container" id="forecast">
      <!-- Forecast days go here -->
    </div>

  </div>

  <script>
    // Helper function to turn text descriptions into cute emojis
    function getWeatherEmoji(desc) {
      desc = desc.toLowerCase();
      if (desc.includes('sun') || desc.includes('clear')) return '☀️';
      if (desc.includes('partly cloudy')) return '⛅';
      if (desc.includes('cloud') || desc.includes('overcast')) return '☁️';
      if (desc.includes('rain') || desc.includes('drizzle') || desc.includes('shower')) return '🌧️';
      if (desc.includes('thunder') || desc.includes('storm')) return '⛈️';
      if (desc.includes('snow') || desc.includes('ice') || desc.includes('blizzard')) return '❄️';
      if (desc.includes('fog') || desc.includes('mist')) return '🌫️';
      return '🌤️'; // Default
    }

    async function loadWeather() {
      try {
        const response = await fetch('https://wttr.in/?format=j1');
        if (!response.ok) throw new Error('Network error');
        const data = await response.json();
        
        // 1. Current Weather
        const area = data.nearest_area[0];
        const cityName = area.areaName[0].value || area.region[0].value;
        const current = data.current_condition[0];
        const conditionText = current.weatherDesc[0].value;

        document.getElementById('city').innerText = cityName;
        document.getElementById('desc').innerText = conditionText.toLowerCase();
        document.getElementById('temp').innerText = `${current.temp_C}°`;
        document.getElementById('main-icon').innerText = getWeatherEmoji(conditionText);

        // 2. Forecast (Next 3 Days)
        const forecastContainer = document.getElementById('forecast');
        forecastContainer.innerHTML = '';

        // We use slice(0,3) to get exactly 3 days to fit the design nicely
        data.weather.slice(0, 3).forEach(dayData => {
          const dateObj = new Date(dayData.date);
          const dayName = dateObj.toLocaleDateString('en-US', { weekday: 'short' });
          const dayCondition = dayData.hourly[4].weatherDesc[0].value; 
          
          const dayHtml = `
            <div class="forecast-day">
              <div class="f-day-name">${dayName}</div>
              <div class="f-icon">${getWeatherEmoji(dayCondition)}</div>
              <div class="f-temp">${dayData.maxtempC}°</div>
            </div>
          `;
          forecastContainer.innerHTML += dayHtml;
        });

        // Show the widget
        document.getElementById('loading').style.display = 'none';
        document.getElementById('widget').style.display = 'flex';

      } catch (err) {
        document.getElementById('loading').innerText = 'Unable to load weather.';
        console.error(err);
      }
    }

    loadWeather();
  </script>
</body>
</html>
