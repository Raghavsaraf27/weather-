<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Dark Weather</title>
  <style>
    :root {
      --bg-color: #191919;
      --card-bg: #222222;
      --text-main: #e3e3e3;
      --text-dim: #787774;
      --accent: #2eaadc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
      overflow: hidden;
    }

    .weather-card {
      width: 100%;
      max-width: 280px;
      background-color: var(--card-bg);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      text-align: center;
      color: var(--text-main);
    }

    .location {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .temp-main {
      font-size: 2.8rem;
      font-weight: 300;
      color: var(--text-main);
      margin: 4px 0;
    }

    .condition {
      font-size: 0.9rem;
      color: var(--text-dim);
      margin-bottom: 16px;
      text-transform: capitalize;
    }

    .forecast {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 12px;
    }

    .forecast-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--text-dim);
    }

    .day-name {
      font-weight: 500;
      width: 40px;
      text-align: left;
    }

    .high-low {
      color: var(--text-main);
      font-weight: 500;
    }

    #loading {
      color: var(--text-dim);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div id="loading">Loading local weather...</div>

  <div class="weather-card" id="card" style="display: none;">
    <div class="location" id="city">--</div>
    <div class="temp-main" id="temp">--°C</div>
    <div class="condition" id="desc">--</div>

    <div class="forecast" id="forecast-list">
      <!-- Forecast Rows -->
    </div>
  </div>

  <script>
    // Uses free wttr.in weather service (No API Key Required!)
    async function loadWeather() {
      try {
        const response = await fetch('https://wttr.in/?format=j1');
        if (!response.ok) throw new Error('Network error');
        
        const data = await response.json();
        
        // Location & Current Weather
        const area = data.nearest_area[0];
        const cityName = area.areaName[0].value || area.region[0].value;
        const current = data.current_condition[0];

        document.getElementById('city').innerText = cityName;
        document.getElementById('temp').innerText = `${current.temp_C}°C`;
        document.getElementById('desc').innerText = current.weatherDesc[0].value.toLowerCase();

        // 3-Day Forecast
        const forecastContainer = document.getElementById('forecast-list');
        forecastContainer.innerHTML = '';

        data.weather.forEach(dayData => {
          const dateObj = new Date(dayData.date);
          const dayName = dateObj.toLocaleDateString('en-US', { weekday: 'short' });
          
          const row = document.createElement('div');
          row.className = 'forecast-row';
          row.innerHTML = `
            <span class="day-name">${dayName}</span>
            <span>${dayData.hourly[4].weatherDesc[0].value}</span>
            <span class="high-low">${dayData.maxtempC}° / ${dayData.mintempC}°C</span>
          `;
          forecastContainer.appendChild(row);
        });

        document.getElementById('loading').style.display = 'none';
        document.getElementById('card').style.display = 'block';

      } catch (err) {
        document.getElementById('loading').innerText = 'Unable to load weather.';
        console.error(err);
      }
    }

    loadWeather();
  </script>
</body>
</html>
