<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aesthetic Weather Widget</title>
  <style>
    :root {
      --bg-color: #191919;
      --card-bg: #202020;
      --border-color: #333333;
      --text-main: #f5f5f5;
      --text-muted: #888888;
      --accent-yellow: #f1c40f;
      --accent-blue: #3498db;
      --accent-cloud: #bdc3c7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      overflow: hidden;
    }

    .widget-container {
      width: 100%;
      max-width: 300px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .location {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-main);
      letter-spacing: 0.5px;
    }

    .condition {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: capitalize;
      background: #2a2a2a;
      padding: 4px 10px;
      border-radius: 12px;
    }

    .main-weather {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
    }

    .icon-large {
      width: 70px;
      height: 70px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .temp-large {
      font-size: 3.5rem;
      font-weight: 300;
      color: var(--text-main);
      letter-spacing: -2px;
    }

    .forecast-container {
      display: flex;
      justify-content: space-between;
      border-top: 1px solid var(--border-color);
      padding-top: 16px;
    }

    .forecast-day {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .f-day-name {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .f-icon {
      width: 24px;
      height: 24px;
    }

    .f-temp {
      font-size: 0.8rem;
      color: var(--text-main);
      font-weight: 500;
    }

    #loading {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    svg {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <div id="loading">Loading aesthetic weather...</div>

  <div class="widget-container" id="widget" style="display: none;">
    
    <div class="header">
      <div class="location" id="city">--</div>
      <div class="condition" id="desc">--</div>
    </div>

    <div class="main-weather">
      <div class="icon-large" id="main-icon"></div>
      <div class="temp-large" id="temp">--°</div>
    </div>

    <div class="forecast-container" id="forecast">
      <!-- Forecast days go here -->
    </div>

  </div>

  <script>
    // Inline SVG Icon Definitions
    const icons = {
      sun: `<svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-yellow)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`,
      cloud: `<svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-cloud)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>`,
      rain: `<svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-blue)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 13v6M8 13v6M12 15v6"/><path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25" stroke="var(--accent-cloud)"/></svg>`,
      partlyCloudy: `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v2M4.93 4.93l1.41 1.41M20 12h2M17.07 4.93l-1.41 1.41" stroke="var(--accent-yellow)"/><path d="M15.93 12.07a5 5 0 0 0-8.86 3.18A5 5 0 0 0 9 20h9a4 4 0 0 0 1.25-7.8 8 8 0 0 0-3.32-0.13z" stroke="var(--accent-cloud)"/></svg>`,
      snow: `<svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-cloud)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 17.58A5 5 0 0 0 18 8h-1.26A8 8 0 1 0 4 16.25"/><line x1="8" y1="16" x2="8.01" y2="16"/><line x1="12" y1="16" x2="12.01" y2="16"/><line x1="16" y1="16" x2="16.01" y2="16"/><line x1="10" y1="20" x2="10.01" y2="20"/><line x1="14" y1="20" x2="14.01" y2="20"/></svg>`
    };

    function getWeatherSvg(desc) {
      desc = desc.toLowerCase();
      if (desc.includes('sun') || desc.includes('clear')) return icons.sun;
      if (desc.includes('partly cloudy')) return icons.partlyCloudy;
      if (desc.includes('rain') || desc.includes('drizzle') || desc.includes('shower')) return icons.rain;
      if (desc.includes('snow') || desc.includes('ice')) return icons.snow;
      return icons.cloud;
    }

    async function loadWeather() {
      try {
        const response = await fetch('https://wttr.in/?format=j1');
        if (!response.ok) throw new Error('Network error');
        const data = await response.json();
        
        const area = data.nearest_area[0];
        const cityName = area.areaName[0].value || area.region[0].value;
        const current = data.current_condition[0];
        const conditionText = current.weatherDesc[0].value;

        document.getElementById('city').innerText = cityName;
        document.getElementById('desc').innerText = conditionText.toLowerCase();
        document.getElementById('temp').innerText = `${current.temp_C}°`;
        document.getElementById('main-icon').innerHTML = getWeatherSvg(conditionText);

        const forecastContainer = document.getElementById('forecast');
        forecastContainer.innerHTML = '';

        data.weather.slice(0, 3).forEach(dayData => {
          const dateObj = new Date(dayData.date);
          const dayName = dateObj.toLocaleDateString('en-US', { weekday: 'short' });
          const dayCondition = dayData.hourly[4].weatherDesc[0].value; 
          
          const dayHtml = `
            <div class="forecast-day">
              <div class="f-day-name">${dayName}</div>
              <div class="f-icon">${getWeatherSvg(dayCondition)}</div>
              <div class="f-temp">${dayData.maxtempC}°</div>
            </div>
          `;
          forecastContainer.innerHTML += dayHtml;
        });

        document.getElementById('loading').style.display = 'none';
        document.getElementById('widget').style.display = 'flex';

      } catch (err) {
        document.getElementById('loading').innerText = 'Unable to load weather.';
        console.error(err);
      }
    }

    loadWeather();
  </script>
</body>
</html>
